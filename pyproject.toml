[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-search"
version = "0.3.0b2"
description = "Local-first RWKV agent with chat, tool use, Web research and evidence-grounded answers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "RWKV Agent contributors"}]
dependencies = ["regex>=2024.5.15"]

[project.urls]
Homepage = "https://github.com/123123213weqw/rwkv-agent"
Documentation = "https://github.com/123123213weqw/rwkv-agent/tree/main/docs"
Issues = "https://github.com/123123213weqw/rwkv-agent/issues"

[project.optional-dependencies]
extract = ["trafilatura>=2.0"]
extraction-bench = [
    "aiohttp>=3.9",
    "trafilatura>=2.0",
    "jusText>=3.0",
    "readability-lxml>=0.8.4",
    "resiliparse>=0.15.2",
]
realtime = [
    "aiohttp>=3.9",
    "selectolax>=0.3",
    "trafilatura>=2.0",
    "resiliparse>=0.15.2",
    "brotli>=1.1",
]
browser = ["playwright>=1.50"]
model = ["torch", "transformers", "safetensors"]
agent = ["fastapi>=0.115", "uvicorn>=0.34", "torch>=2.5", "safetensors>=0.5"]
retrieval = ["sentence-transformers", "faiss-cpu"]
segment = ["jieba>=0.42.1"]
analysis = ["jieba>=0.42.1"]
indexing = ["pyarrow>=14", "opencc-python-reimplemented>=0.1.7"]
dev = ["pytest>=7", "tomli>=2; python_version < '3.11'"]

[project.scripts]
rwkv-search = "rwkv_search.cli:main"
rwkv-agent-server = "rwkv_agent.server:main"
rwkv-agent-data-plane = "rwkv_agent.data_server:main"
rwkv-g1i-sidecar = "rwkv_agent.sidecar:main"
rwkv-statepool-drain = "rwkv_agent.statepool_drain:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rwkv_search = ["web/*"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["bench/baselines"]

[tool.ruff.lint]
# Keep CI focused on correctness checks. Opt into additional style rules in a
# dedicated cleanup instead of inheriting version-dependent Ruff defaults.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
