[package]
name = "rwkv-agent-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "HTTP server for the Rust-first RWKV Agent control plane"

[[bin]]
name = "rwkv-agent-server-rs"
path = "src/main.rs"

[dependencies]
rwkv-agent-runtime = { path = "../agent-runtime" }
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }
