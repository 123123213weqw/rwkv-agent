[package]
name = "rwkv-agent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal client for RWKV tools and opt-in state-native research"

[[bin]]
name = "rwkv-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.16"
dirs = "6.0"
indicatif = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustyline = "17.0"
serde_json = "1.0"
