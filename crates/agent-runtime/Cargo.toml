[package]
name = "rwkv-agent-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Rust control plane for RWKV recurrent State, tools and sessions"

[dependencies]
rwkv-agent-core = { path = "../agent-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "process", "sync", "time"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread"] }
