[package]
name = "rwkv-statepool-cloud-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Optional out-of-process StatePool placement, Worker registry and FinOps service"

[[bin]]
name = "rwkv-statepool-cloud-plugin"
path = "src/main.rs"

[dependencies]
rwkv-statepool-plugin-api = { path = "../statepool-plugin-api" }
axum = "0.8"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
object_store = { version = "0.13", default-features = false, features = ["aws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }
