[package]
name = "rwkv-state-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Rust-only stateful inference contract and long-lived Agent scheduler benchmark"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3.20"

[[bin]]
name = "rwkv-state-bench"
path = "src/bin/rwkv-state-bench.rs"

[[bin]]
name = "rwkv-memory-audit"
path = "src/bin/rwkv-memory-audit.rs"

[[bin]]
name = "rwkv-trace-audit"
path = "src/bin/rwkv-trace-audit.rs"

[[bin]]
name = "rwkv-rust-migration-audit"
path = "src/bin/rwkv-rust-migration-audit.rs"

[[bin]]
name = "rwkv-qwen-live-bench"
path = "src/bin/rwkv-qwen-live-bench.rs"

[[bin]]
name = "rwkv-rwkv-live-bench"
path = "src/bin/rwkv-rwkv-live-bench.rs"
