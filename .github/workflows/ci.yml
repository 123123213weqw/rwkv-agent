name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[realtime,segment,dev]' fastapi uvicorn ruff==0.15.22 build jsonschema pyyaml
      - name: Public release audit
        run: python scripts/check_public_release.py
      - name: StatePool client contracts
        run: python scripts/check_statepool_contracts.py
      - name: Lint
        run: ruff check src bench benchmarks tests scripts integrations
      - name: Test
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src:. python -m pytest -q
      - name: Build package
        run: |
          python -m build
          python -m build integrations/vllm_rwkv7

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: CLI mock smoke
        run: bash cli/tests/cli_smoke.sh
      - name: CLI install smoke
        run: bash cli/tests/install_smoke.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          bash -n cli/install.sh cli/package-release.sh cli/tests/install_smoke.sh
          cli/scripts/rwkv cli/scripts/rwkv-agent-service
          deploy/agent/start_g1i_sidecars.sh deploy/agent/stop_g1i_sidecars.sh
          deploy/agent/start_vllm_rwkv7.sh deploy/agent/stop_vllm_rwkv7.sh
