name: CLI release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' cli/Cargo.toml | head -n 1)
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Test terminal client
        working-directory: cli
        run: |
          cargo test --locked --target "${{ matrix.target }}"
          cargo clippy --all-targets --target "${{ matrix.target }}" -- -D warnings
      - name: Build release archive
        run: cli/package-release.sh "${{ matrix.target }}" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: rwkv-agent-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rwkv-agent-*
          path: dist
          merge-multiple: true
      - name: Verify release checksums
        run: |
          cd dist
          for checksum in *.sha256; do
            shasum -a 256 -c "$checksum"
          done
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "RWKV Agent $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease \
            --verify-tag
