<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="920" height="400" fill="#0d1117"/>

  <text x="40" y="38" fill="#e6edf3" font-size="17" font-weight="600">Memory: 31 concurrent sessions on one 24 GB card</text>

  <!-- Transformer column -->
  <text x="40" y="82" fill="#8b949e" font-size="13">Transformer 7B · GQA-8 · 16K context</text>

  <!-- KV cache grows -->
  <g>
    <rect x="40" y="100" width="90" height="210" fill="#21262d" stroke="#30363d"/>
    <rect x="40" y="250" width="90" height="60" fill="#8b3a3a" stroke="#a04040"/>
    <text x="85" y="238" fill="#c9d1d9" font-size="11" text-anchor="middle">4K</text>
    <text x="85" y="200" fill="#c9d1d9" font-size="11" text-anchor="middle">16K</text>
    <text x="85" y="150" fill="#c9d1d9" font-size="11" text-anchor="middle">64K</text>
    <text x="85" y="340" fill="#8b949e" font-size="12" text-anchor="middle">grows with context</text>
  </g>

  <!-- per session / total -->
  <text x="160" y="140" fill="#e6edf3" font-size="13">1 GiB / session</text>
  <text x="160" y="172" fill="#f85149" font-size="26" font-weight="700">31 GiB</text>
  <text x="160" y="196" fill="#8b949e" font-size="12">for 31 sessions</text>
  <text x="160" y="240" fill="#f85149" font-size="14" font-weight="600">DOES NOT FIT</text>
  <text x="160" y="262" fill="#8b949e" font-size="12">13.9 GiB weights + 31 GiB → 45 GiB</text>

  <!-- divider -->
  <line x1="470" y1="70" x2="470" y2="340" stroke="#30363d" stroke-dasharray="4 4"/>

  <!-- RWKV column -->
  <text x="510" y="82" fill="#8b949e" font-size="13">RWKV-7 7.2B · fixed state</text>

  <g>
    <rect x="510" y="100" width="90" height="210" fill="#21262d" stroke="#30363d"/>
    <rect x="510" y="286" width="90" height="24" fill="#2e7d4f" stroke="#3fa96b"/>
    <text x="555" y="340" fill="#8b949e" font-size="12" text-anchor="middle">constant</text>
  </g>

  <text x="630" y="140" fill="#e6edf3" font-size="13">32.5 MiB / session</text>
  <text x="630" y="172" fill="#3fb950" font-size="26" font-weight="700">0.98 GiB</text>
  <text x="630" y="196" fill="#8b949e" font-size="12">for 31 sessions</text>
  <text x="630" y="240" fill="#3fb950" font-size="14" font-weight="600">FITS</text>
  <text x="630" y="262" fill="#8b949e" font-size="12">13.9 GiB weights + 0.98 GiB → 14.9 GiB</text>

  <text x="40" y="380" fill="#6e7681" font-size="11">31× more sessions for 1/31 the memory. Not faster — it fits.</text>
</svg>
