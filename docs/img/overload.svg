<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="920" height="320" fill="#0d1117"/>

  <text x="40" y="36" fill="#e6edf3" font-size="17" font-weight="600">Overload: 48 concurrent requests</text>

  <!-- BEFORE -->
  <text x="40" y="76" fill="#8b949e" font-size="13" font-weight="600">BEFORE</text>
  <g>
    <!-- 48 cells, 44 red (503), 2 green, 2 grey -->
    <g fill="#8b3a3a">
      <rect x="40" y="88" width="14" height="14"/><rect x="56" y="88" width="14" height="14"/>
      <rect x="72" y="88" width="14" height="14"/><rect x="88" y="88" width="14" height="14"/>
      <rect x="104" y="88" width="14" height="14"/><rect x="120" y="88" width="14" height="14"/>
      <rect x="136" y="88" width="14" height="14"/><rect x="152" y="88" width="14" height="14"/>
      <rect x="168" y="88" width="14" height="14"/><rect x="184" y="88" width="14" height="14"/>
      <rect x="200" y="88" width="14" height="14"/><rect x="216" y="88" width="14" height="14"/>
      <rect x="232" y="88" width="14" height="14"/><rect x="248" y="88" width="14" height="14"/>
      <rect x="264" y="88" width="14" height="14"/><rect x="280" y="88" width="14" height="14"/>
      <rect x="296" y="88" width="14" height="14"/><rect x="312" y="88" width="14" height="14"/>
      <rect x="328" y="88" width="14" height="14"/><rect x="344" y="88" width="14" height="14"/>
      <rect x="360" y="88" width="14" height="14"/><rect x="376" y="88" width="14" height="14"/>
      <rect x="392" y="88" width="14" height="14"/><rect x="408" y="88" width="14" height="14"/>
    </g>
    <g fill="#2e7d4f">
      <rect x="424" y="88" width="14" height="14"/><rect x="440" y="88" width="14" height="14"/>
    </g>
    <g fill="#30363d">
      <rect x="456" y="88" width="14" height="14"/><rect x="472" y="88" width="14" height="14"/>
    </g>
  </g>
  <text x="40" y="124" fill="#f85149" font-size="12">46 × 503 Service Unavailable</text>
  <text x="40" y="144" fill="#8b949e" font-size="12">pool alloc=48 free=0</text>
  <text x="40" y="164" fill="#f85149" font-size="12" font-weight="600">recovery: kill -9, restart</text>

  <!-- AFTER -->
  <text x="520" y="76" fill="#8b949e" font-size="13" font-weight="600">AFTER</text>
  <g>
    <!-- 32 green, 16 amber -->
    <g fill="#2e7d4f">
      <rect x="520" y="88" width="14" height="14"/><rect x="536" y="88" width="14" height="14"/>
      <rect x="552" y="88" width="14" height="14"/><rect x="568" y="88" width="14" height="14"/>
      <rect x="584" y="88" width="14" height="14"/><rect x="600" y="88" width="14" height="14"/>
      <rect x="616" y="88" width="14" height="14"/><rect x="632" y="88" width="14" height="14"/>
      <rect x="648" y="88" width="14" height="14"/><rect x="664" y="88" width="14" height="14"/>
      <rect x="680" y="88" width="14" height="14"/><rect x="696" y="88" width="14" height="14"/>
      <rect x="712" y="88" width="14" height="14"/><rect x="728" y="88" width="14" height="14"/>
      <rect x="744" y="88" width="14" height="14"/><rect x="760" y="88" width="14" height="14"/>
    </g>
    <g fill="#9e6a03">
      <rect x="776" y="88" width="14" height="14"/><rect x="792" y="88" width="14" height="14"/>
      <rect x="808" y="88" width="14" height="14"/><rect x="824" y="88" width="14" height="14"/>
      <rect x="840" y="88" width="14" height="14"/><rect x="856" y="88" width="14" height="14"/>
      <rect x="872" y="88" width="14" height="14"/><rect x="888" y="88" width="14" height="14"/>
    </g>
  </g>
  <text x="520" y="124" fill="#3fb950" font-size="12">32 × 200 ok</text>
  <text x="640" y="124" fill="#d29922" font-size="12">16 × 429 retryable</text>
  <text x="520" y="144" fill="#8b949e" font-size="12">pool alloc=41 free=7</text>
  <text x="520" y="164" fill="#3fb950" font-size="12" font-weight="600">recovery: none, still serving</text>

  <!-- separator -->
  <line x1="40" y1="190" x2="880" y2="190" stroke="#21262d"/>

  <!-- the point -->
  <text x="40" y="222" fill="#c9d1d9" font-size="13">The difference is not the failure count. It is what the status code means:</text>

  <rect x="40" y="240" width="380" height="46" fill="#1c2128" stroke="#8b3a3a"/>
  <text x="56" y="260" fill="#f85149" font-size="13" font-weight="600">503 unavailable</text>
  <text x="56" y="278" fill="#8b949e" font-size="11">"the service is broken" → operator wakes up</text>

  <rect x="480" y="240" width="400" height="46" fill="#1c2128" stroke="#9e6a03"/>
  <text x="496" y="260" fill="#d29922" font-size="13" font-weight="600">429 too many requests</text>
  <text x="496" y="278" fill="#8b949e" font-size="11">"slow down" → client backs off and retries</text>
</svg>
