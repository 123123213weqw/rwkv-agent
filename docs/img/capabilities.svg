<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="920" height="410" fill="#0d1117"/>

  <text x="40" y="36" fill="#e6edf3" font-size="17" font-weight="600">What the agent can do — and how it fails when it cannot</text>

  <!-- headers -->
  <text x="40" y="76" fill="#6e7681" font-size="11">CAPABILITY</text>
  <text x="400" y="76" fill="#6e7681" font-size="11">RESULT</text>
  <text x="620" y="76" fill="#6e7681" font-size="11">FAILURE MODE</text>
  <line x1="40" y1="86" x2="880" y2="86" stroke="#30363d"/>

  <!-- working rows: result text at fixed x=520, failure at x=620 -->
  <g font-size="13">
    <text x="40" y="114" fill="#c9d1d9">read one file</text>
    <rect x="400" y="102" width="96" height="15" fill="#2e7d4f"/>
    <text x="520" y="114" fill="#3fb950" font-weight="600">17/20</text>
    <text x="620" y="114" fill="#8b949e" font-size="12">visible error</text>

    <text x="40" y="142" fill="#c9d1d9">run a command</text>
    <rect x="400" y="130" width="24" height="15" fill="#2e7d4f"/>
    <text x="520" y="142" fill="#3fb950" font-weight="600">4/6</text>
    <text x="620" y="142" fill="#8b949e" font-size="12">visible error</text>

    <text x="40" y="170" fill="#c9d1d9">plain chat</text>
    <rect x="400" y="158" width="36" height="15" fill="#2e7d4f"/>
    <text x="520" y="170" fill="#3fb950" font-weight="600">6/6</text>
    <text x="620" y="170" fill="#6e7681" font-size="12">—</text>
  </g>

  <line x1="40" y1="188" x2="880" y2="188" stroke="#21262d"/>

  <!-- failing rows -->
  <g font-size="13">
    <text x="40" y="216" fill="#c9d1d9">write a file</text>
    <text x="520" y="216" fill="#f85149" font-weight="600">0/6</text>
    <text x="620" y="216" fill="#8b949e" font-size="12">protocol error</text>

    <text x="40" y="244" fill="#c9d1d9">two files, one message</text>
    <text x="520" y="244" fill="#f85149" font-weight="600">0/6</text>
    <text x="620" y="244" fill="#8b949e" font-size="12">degenerate loop</text>
  </g>

  <line x1="40" y1="262" x2="880" y2="262" stroke="#30363d" stroke-dasharray="3 3"/>

  <!-- silent rows -->
  <g font-size="13">
    <text x="40" y="290" fill="#c9d1d9">ordinal query ("third")</text>
    <rect x="400" y="278" width="28" height="15" fill="#8b3a3a"/>
    <text x="520" y="290" fill="#f85149" font-weight="600">10/24</text>
    <text x="620" y="290" fill="#d29922" font-size="12" font-weight="600">WRONG, but plausible</text>

    <text x="40" y="318" fill="#c9d1d9">routing gate</text>
    <rect x="400" y="306" width="4" height="15" fill="#8b3a3a"/>
    <text x="520" y="318" fill="#f85149" font-weight="600">~10%</text>
    <text x="620" y="318" fill="#d29922" font-size="12" font-weight="600">WRONG, status=ok, no tool</text>
  </g>

  <!-- bracket on the left edge of the failure column -->
  <path d="M 606 274 L 612 274 L 612 326 L 606 326" fill="none" stroke="#d29922" stroke-width="2"/>
  <text x="400" y="352" fill="#d29922" font-size="12" font-weight="600">the two silent ones have no recovery signal</text>

  <text x="40" y="388" fill="#6e7681" font-size="11">A visible error costs a retry. A silent wrong answer costs trust, and the caller cannot tell it happened.</text>
</svg>
