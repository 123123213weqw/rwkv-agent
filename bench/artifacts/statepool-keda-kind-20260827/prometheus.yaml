apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: statepool-keda
data:
  prometheus.yml: |
    global:
      scrape_interval: 1s
      evaluation_interval: 1s
    scrape_configs:
      - job_name: statepool
        static_configs:
          - targets: ["statepool.statepool-keda.svc.cluster.local:8130"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: statepool-keda
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.11.3
          imagePullPolicy: Never
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http }, periodSeconds: 2 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: statepool-keda
spec:
  selector: { app: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
