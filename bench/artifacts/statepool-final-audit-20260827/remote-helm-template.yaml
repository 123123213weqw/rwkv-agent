---
# Source: rwkv-statepool/templates/plugin-pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: statepool-rwkv-statepool-state
  labels:
    app.kubernetes.io/name: rwkv-statepool
    app.kubernetes.io/instance: statepool
    app.kubernetes.io/version: "0.3.0-beta.2"
    app.kubernetes.io/managed-by: Helm
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
# Source: rwkv-statepool/templates/plugin-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: statepool-rwkv-statepool
  labels:
    app.kubernetes.io/name: rwkv-statepool
    app.kubernetes.io/instance: statepool
    app.kubernetes.io/version: "0.3.0-beta.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: statepool-plugin
spec:
  selector:
    app.kubernetes.io/name: rwkv-statepool
    app.kubernetes.io/instance: statepool
    app.kubernetes.io/component: statepool-plugin
  ports:
    - name: http
      port: 8130
      targetPort: http
---
# Source: rwkv-statepool/templates/plugin-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statepool-rwkv-statepool
  labels:
    app.kubernetes.io/name: rwkv-statepool
    app.kubernetes.io/instance: statepool
    app.kubernetes.io/version: "0.3.0-beta.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: statepool-plugin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rwkv-statepool
      app.kubernetes.io/instance: statepool
      app.kubernetes.io/component: statepool-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rwkv-statepool
        app.kubernetes.io/instance: statepool
        app.kubernetes.io/component: statepool-plugin
    spec:
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: statepool-plugin
          image: "ghcr.io/123123213weqw/rwkv-statepool-cloud-plugin:0.3.0-beta.2-dev"
          imagePullPolicy: IfNotPresent
          args:
            - --host=0.0.0.0
            - --port=8130
            - --worker-ttl-seconds=30
            - --lease-max-ttl-seconds=120
            - --max-state-bytes=536870912
            - --state-dir=/var/lib/statepool/states
          ports:
            - name: http
              containerPort: 8130
          readinessProbe:
            httpGet: { path: /plugin/v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /live, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: state
              mountPath: /var/lib/statepool/states
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: statepool-rwkv-statepool-state
        - name: tmp
          emptyDir: {}
