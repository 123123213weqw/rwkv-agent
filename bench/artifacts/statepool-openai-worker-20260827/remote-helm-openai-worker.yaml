apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-rwkv-statepool-state
  labels:
    app.kubernetes.io/name: rwkv-statepool
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "0.3.0-beta.2"
    app.kubernetes.io/managed-by: Helm
spec:
  accessModes: [ReadWriteOnce]
  resources:
