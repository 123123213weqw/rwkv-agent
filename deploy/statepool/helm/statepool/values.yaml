nameOverride: ""
fullnameOverride: ""

plugin:
  replicaCount: 1
  image:
    repository: ghcr.io/123123213weqw/rwkv-statepool-cloud-plugin
    tag: 0.3.0-beta.2-dev
    pullPolicy: IfNotPresent
  port: 8130
  workerTtlSeconds: 30
  leaseMaxTtlSeconds: 120
  # Keep large byte counts as decimal strings. Helm/YAML otherwise coerces
  # this value through float64 and can render an invalid `5.36870912e+08`
  # command-line argument.
  maxStateBytes: "536870912"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  durable:
    enabled: false
    postgresSecret: { name: "", key: postgres-url }
    s3Secret:
      name: ""
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key
    s3:
      bucket: ""
      region: us-east-1
      endpoint: ""
      prefix: recurrent-state
      allowHttp: false

controller:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/123123213weqw/rwkv-agent-controller
    tag: 0.3.0-beta.2-dev
    pullPolicy: IfNotPresent
  port: 18120
  modelUrls: http://replace-with-always-reachable-routing-sidecar:8118
  dataPlaneUrl: http://replace-with-data-plane:8121
  cloudPlugin:
    fallback: fail_closed
    privacy: cloud_allowed
    latencySloMs: 5000
    preferredZone: cloud
    stateLifecycle: true
    stateTargetTier: cold
    leaseTtlSeconds: 120
    lifecycleTimeoutSeconds: 180
  model:
    id: rwkv7-g1i-preview4922-13.3b
    revision: replace-with-immutable-model-revision
    tokenizer: rwkv-world-v20230424
    stateAbi: rwkv7-g1i-fp16-v1
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 1Gi }

# The adapter exists in rwkv-agent; the image remains a deliberate placeholder
# until it is packaged together with the selected model runtime and weights.
worker:
  enabled: false
  replicaCount: 1
  image:
    repository: replace.example/rwkv-statepool-worker
    tag: replace-with-immutable-tag
    pullPolicy: IfNotPresent
  port: 18118
  model:
    id: rwkv7-g1i-preview4922-13.3b
    revision: replace-with-immutable-model-revision
    tokenizer: rwkv-world-v20230424
    stateAbi: rwkv7-g1i-fp16-v1
  zone: cloud
  stateSlots: 32
  maxBatch: 32
  heartbeatSeconds: 5
  device:
    vendor: NVIDIA
    model: replace-with-node-gpu-model
    runtime: CUDA
    memoryBytes: 0
  price:
    currency: CNY
    perGpuHour: "2.8"
  resources:
    requests:
      nvidia.com/gpu: "1"
      cpu: "2"
      memory: 8Gi
    limits:
      nvidia.com/gpu: "1"
      cpu: "8"
      memory: 32Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 180

autoscaling:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 8
  pollingInterval: 5
  cooldownPeriod: 300
  initialCooldownPeriod: 30
  pendingRequestsTarget: "1"
  decodeSecondsTarget: "30"
  prometheusServerAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090

serviceMonitor:
  enabled: false
  interval: 5s
  labels: {}

grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
