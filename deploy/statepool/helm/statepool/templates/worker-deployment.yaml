{{- if .Values.worker.enabled }}
{{- if and (eq .Values.worker.protocol "openai_compatible") (not .Values.worker.openaiCompatible.upstreamUrl) }}
{{- fail "worker.openaiCompatible.upstreamUrl is required for protocol=openai_compatible" }}
{{- end }}
{{- if and .Values.autoscaling.enabled (lt (int .Values.worker.terminationGracePeriodSeconds) 20) }}
{{- fail "worker.terminationGracePeriodSeconds must be at least 20 when autoscaling is enabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rwkv-statepool.fullname" . }}-worker
  labels:
    {{- include "rwkv-statepool.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference-worker
spec:
  replicas: {{ ternary 0 .Values.worker.replicaCount .Values.autoscaling.enabled }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rwkv-statepool.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: inference-worker
  template:
    metadata:
      annotations:
        checksum/statepool-worker-contract: "statepool-worker-capability.v1"
        statepool.rwkv-agent.dev/state-mode: {{ ternary "affinity_only" "native_export" (eq .Values.worker.protocol "openai_compatible") | quote }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "rwkv-statepool.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: inference-worker
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - { name: RWKV_STATEPOOL_URL, value: "http://{{ include "rwkv-statepool.fullname" . }}:{{ .Values.plugin.port }}" }
            - { name: RWKV_WORKER_PORT, value: {{ .Values.worker.port | quote }} }
            - { name: RWKV_OPENAI_WORKER_PORT, value: {{ .Values.worker.port | quote }} }
            - { name: RWKV_WORKER_ENDPOINT, value: "http://$(POD_IP):{{ .Values.worker.port }}" }
            - { name: RWKV_WORKER_ZONE, value: {{ .Values.worker.zone | quote }} }
            - { name: RWKV_WORKER_MODEL_ID, value: {{ .Values.worker.model.id | quote }} }
            - { name: RWKV_WORKER_MODEL_REVISION, value: {{ .Values.worker.model.revision | quote }} }
            - { name: RWKV_WORKER_TOKENIZER, value: {{ .Values.worker.model.tokenizer | quote }} }
            - { name: RWKV_WORKER_STATE_ABI, value: {{ .Values.worker.model.stateAbi | quote }} }
            - { name: RWKV_WORKER_STATE_SLOTS, value: {{ .Values.worker.stateSlots | quote }} }
            - { name: RWKV_WORKER_MAX_BATCH, value: {{ .Values.worker.maxBatch | quote }} }
            - { name: RWKV_WORKER_HEARTBEAT_SECONDS, value: {{ .Values.worker.heartbeatSeconds | quote }} }
            - { name: RWKV_WORKER_DEVICE_VENDOR, value: {{ .Values.worker.device.vendor | quote }} }
            - { name: RWKV_WORKER_DEVICE_MODEL, value: {{ .Values.worker.device.model | quote }} }
            - { name: RWKV_WORKER_DEVICE_RUNTIME, value: {{ .Values.worker.device.runtime | quote }} }
            - { name: RWKV_WORKER_DEVICE_MEMORY_BYTES, value: {{ .Values.worker.device.memoryBytes | quote }} }
            - { name: RWKV_WORKER_PRICE_CURRENCY, value: {{ .Values.worker.price.currency | quote }} }
            - { name: RWKV_WORKER_PRICE_PER_GPU_HOUR, value: {{ .Values.worker.price.perGpuHour | quote }} }
            {{- if eq .Values.worker.protocol "openai_compatible" }}
            - { name: RWKV_OPENAI_UPSTREAM_URL, value: {{ .Values.worker.openaiCompatible.upstreamUrl | quote }} }
            - { name: RWKV_OPENAI_UPSTREAM_MODEL, value: {{ .Values.worker.openaiCompatible.upstreamModel | quote }} }
            {{- with .Values.worker.openaiCompatible.upstreamApiKeySecret.name }}
            - name: RWKV_OPENAI_UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.worker.openaiCompatible.upstreamApiKeySecret.key | quote }}
            {{- end }}
            {{- with .Values.worker.openaiCompatible.ingressApiKeySecret.name }}
            - name: RWKV_OPENAI_WORKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.worker.openaiCompatible.ingressApiKeySecret.key | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: inference
              containerPort: {{ .Values.worker.port }}
          readinessProbe:
            httpGet: { path: /ready, port: inference }
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /live, port: inference }
            periodSeconds: 10
          # Drain stops admission and waits for in-flight work. Native RWKV
          # also waits for every dirty State to be fenced and snapshotted;
          # affinity-only adapters own no portable State.
          lifecycle:
            preStop:
              exec:
                command:
                  {{- if eq .Values.worker.protocol "openai_compatible" }}
                  - python
                  - -m
                  - rwkv_agent.statepool_drain
                  - --worker-url=http://127.0.0.1:{{ .Values.worker.port }}
                  {{- else }}
                  - /usr/local/bin/rwkv-statepool-drain
                  {{- end }}
                  - --deadline-seconds={{ sub .Values.worker.terminationGracePeriodSeconds 10 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- if eq .Values.worker.protocol "openai_compatible" }}
            {{- toYaml .Values.worker.openaiCompatible.resources | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.worker.resources | nindent 12 }}
            {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
