apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rwkv-statepool.fullname" . }}
  labels:
    {{- include "rwkv-statepool.labels" . | nindent 4 }}
    app.kubernetes.io/component: statepool-plugin
spec:
  # In-memory Lease metadata makes this development profile single-replica.
  replicas: {{ .Values.plugin.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rwkv-statepool.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: statepool-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rwkv-statepool.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: statepool-plugin
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: statepool-plugin
          image: "{{ .Values.plugin.image.repository }}:{{ .Values.plugin.image.tag }}"
          imagePullPolicy: {{ .Values.plugin.image.pullPolicy }}
          args:
            - --host=0.0.0.0
            - --port={{ .Values.plugin.port }}
            - --worker-ttl-seconds={{ .Values.plugin.workerTtlSeconds }}
            - --lease-max-ttl-seconds={{ .Values.plugin.leaseMaxTtlSeconds }}
            - --max-state-bytes={{ .Values.plugin.maxStateBytes }}
            - --state-dir=/var/lib/statepool/states
          ports:
            - name: http
              containerPort: {{ .Values.plugin.port }}
          readinessProbe:
            httpGet: { path: /plugin/v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /live, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.plugin.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/statepool/states
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          {{- if .Values.plugin.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "rwkv-statepool.fullname" . }}-state
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
