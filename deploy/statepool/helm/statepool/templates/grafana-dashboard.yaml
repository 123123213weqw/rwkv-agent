{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rwkv-statepool.fullname" . }}-grafana-dashboard
  labels:
    {{- include "rwkv-statepool.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  statepool-overview.json: |-
{{ .Files.Get "files/statepool-overview.json" | indent 4 }}
{{- end }}
