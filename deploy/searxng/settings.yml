use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "change-me-before-exposing"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  request_timeout: 3.5
  max_request_timeout: 8.0
  pool_connections: 20
  pool_maxsize: 10

engines:
  - name: dogpile
    disabled: false
  - name: naver
    disabled: false
  - name: baidu
    disabled: false
  - name: yandex
    disabled: false
  - name: github
    disabled: false
  - name: arxiv
    disabled: false
